<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">Four scenes from Nocturne No. 9</title><desc id="desc">Four illustrated chapter cards for the project's main themes.</desc><rect width="1200" height="380" fill="#050404"/><path d="M40 40H1160M40 347H1160" stroke="#c06a1f" stroke-opacity=".8"/><path d="M320 40V347" stroke="#c06a1f" stroke-opacity=".55"/><text x="55" y="67" fill="#c06a1f" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 01</text><circle cx="180" cy="173" r="68" fill="none" stroke="#d8b56a" stroke-opacity=".7" stroke-width="2"/><circle cx="180" cy="173" r="46" fill="none" stroke="#c06a1f" stroke-opacity=".65"/><path d="M180 106V240M113 173H247" stroke="#d8b56a" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="180" cy="173" r="17" fill="#d8b56a"/> --><text x="180" y="191" text-anchor="middle" fill="#d8b56a" font-family="Georgia,serif" font-size="54" font-style="italic">B</text><text x="55" y="281" fill="#efe6d5" font-family="Georgia,serif" font-style="italic" font-size="22">Bergamot</text><text x="55" y="307" fill="#c06a1f" font-family="Arial,sans-serif" font-size="11">A bright opening in the dark.</text><path d="M600 40V347" stroke="#c06a1f" stroke-opacity=".55"/><text x="335" y="67" fill="#c06a1f" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 02</text><circle cx="460" cy="173" r="68" fill="none" stroke="#d8b56a" stroke-opacity=".7" stroke-width="2"/><circle cx="460" cy="173" r="46" fill="none" stroke="#c06a1f" stroke-opacity=".65"/><path d="M460 106V240M393 173H527" stroke="#d8b56a" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="460" cy="173" r="17" fill="#d8b56a"/> --><text x="460" y="191" text-anchor="middle" fill="#d8b56a" font-family="Georgia,serif" font-size="54" font-style="italic">I</text><text x="335" y="281" fill="#efe6d5" font-family="Georgia,serif" font-style="italic" font-size="22">Iris</text><text x="335" y="307" fill="#c06a1f" font-family="Arial,sans-serif" font-size="11">A powder-soft floral heart.</text><path d="M880 40V347" stroke="#c06a1f" stroke-opacity=".55"/><text x="615" y="67" fill="#c06a1f" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 03</text><circle cx="740" cy="173" r="68" fill="none" stroke="#d8b56a" stroke-opacity=".7" stroke-width="2"/><circle cx="740" cy="173" r="46" fill="none" stroke="#c06a1f" stroke-opacity=".65"/><path d="M740 106V240M673 173H807" stroke="#d8b56a" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="740" cy="173" r="17" fill="#d8b56a"/> --><text x="740" y="191" text-anchor="middle" fill="#d8b56a" font-family="Georgia,serif" font-size="54" font-style="italic">V</text><text x="615" y="281" fill="#efe6d5" font-family="Georgia,serif" font-style="italic" font-size="22">Vanilla</text><text x="615" y="307" fill="#c06a1f" font-family="Arial,sans-serif" font-size="11">Warmth settles beneath the</text><text x="615" y="325" fill="#c06a1f" font-family="Arial,sans-serif" font-size="11">bloom.</text><path d="M1160 40V347" stroke="#c06a1f" stroke-opacity=".55"/><text x="895" y="67" fill="#c06a1f" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 04</text><circle cx="1020" cy="173" r="68" fill="none" stroke="#d8b56a" stroke-opacity=".7" stroke-width="2"/><circle cx="1020" cy="173" r="46" fill="none" stroke="#c06a1f" stroke-opacity=".65"/><path d="M1020 106V240M953 173H1087" stroke="#d8b56a" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="1020" cy="173" r="17" fill="#d8b56a"/> --><text x="1020" y="191" text-anchor="middle" fill="#d8b56a" font-family="Georgia,serif" font-size="54" font-style="italic">O</text><text x="895" y="281" fill="#efe6d5" font-family="Georgia,serif" font-style="italic" font-size="22">Oud</text><text x="895" y="307" fill="#c06a1f" font-family="Arial,sans-serif" font-size="11">A deep base that lingers.</text></svg>